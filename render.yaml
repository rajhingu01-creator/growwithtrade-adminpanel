services:
  - type: web
    name: growwithtrade
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://growwithtrade2020.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: UROPAY_API_KEY
        sync: false
      - key: PASSWORD_ENC_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
